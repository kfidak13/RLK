# Publishes the scanner page to https://kfidak13.github.io/RLK/ on every push to main.
name: Publish page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # The page's Update Arduino button uploads this compiled copy of firmware/scanner.
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core install arduino:avr
      - run: npm run firmware --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
        env:
          PAGES_BASE_PATH: /RLK
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
